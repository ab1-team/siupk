; User.ini untuk pelaporan OJK yang render-nya lambat
; Agar tidak kena Gateway Timeout / 504 dari nginx atau PHP-FPM

; Maksimum waktu eksekusi PHP per-request (detik)
; DRP/DRPL/DRPY butuh ~60-80s pertama kali render
max_execution_time = 300

; Maksimum waktu input parsing (POST/PUT) - detik
max_input_time = 300

; Maksimum memori yang boleh dipakai PHP (4 GB)
memory_limit = 2048M

; Maksimum ukuran upload file
post_max_size = 100M
upload_max_filesize = 100M

; Maksimum waktu idle PHP (realpath cache, dsb.)
realpath_cache_ttl = 600
